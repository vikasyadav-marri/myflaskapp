apiVersion: apps/v1
kind: Deployment
metadata:
  name: dockertest-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dockertest
  template:
    metadata:
      labels: 
        app: dockertest
    spec:
      containers:
        - name: dockertest
          image: dockertest:latest
          ports:
            - containerPort: 5000